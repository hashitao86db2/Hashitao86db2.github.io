<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habri'a</title>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-locked">

    <div id="intro-layer">
        <button class="skip-btn" onclick="showHub()">SKIP ➔</button>
        <div class="intro-container">
            <p class="typewriter" style="--d: 0s;">眾神撥開了混沌的霧氣...</p>
            <p class="typewriter" style="--d: 4s;">賽琳握起筆，開始記錄這世間的呼吸。</p>
            <p class="typewriter" style="--d: 8s;">這裡是 Habri'a，一切故事的起源。</p>
        </div>
    </div>

    <main id="main-hub">
        <header class="hub-header">
            <h1 class="world-title">Mimameidr</h1>
            <p class="subtitle">—— 萬物紀錄之書庫 ——</p>
        </header>
    <div class="library-container">
        <div class="bookshelf">
            <a href="myth.html" class="book-spine book-1">
                <span class="book-title">神話：創世之章</span>
            </a>
            <a href="map.html" class="book-spine book-2">
                <span class="book-title">地圖：現世疆域</span>
            </a>
            <a href="library.html" class="book-spine book-3">
                <span class="book-title">世界軼聞</span>
            </a>
            <a href="journal.html" class="book-spine book-4">
                <span class="book-title">賽琳的手記</span>
            </a>
            <a href="characters.html" class="book-spine book-5">
                <span class="book-title">人物傳記</span>
            </a>
            <a href="lexicon.html" class="book-spine book-6">
                <span class="book-title">世界的奧秘</span>
            </a>
        </div>
        <div class="shelf-board"></div>
    </div>

    <div class="scroll-hint white-hint">
        
        <div class="arrow">↓</div>
    </div>
    <div style="height: 25vh;"></div>
</main>

<section id="afterlife-layer">
        <div class="mirror-shards"></div>
        <div id="rules-paper" class="paper">
            <div class="paper-content">
                <h2>死後世界：守則</h2>
                <hr>
                <div class="rules-text">
                    <p>1. 放下生者的重量。</p>
                    <p>2. 越過忘川者，不可回頭。</p>
                    <p>3. 聲音在此處是禁忌。</p>
                </div>
                <p class="seal">—— 審判者署名</p>
            </div>
        </div>
        <div class="afterlife-title">此處為終焉，亦是起始</div>
    </section>

    <script src="script.js"></script>
</body>
</html>
