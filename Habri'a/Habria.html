<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habri'a</title>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="intro-layer">
        <button class="skip-btn" onclick="showHub()">SKIP ➔</button>
        <div class="intro-container">
            <p class="typewriter" style="--d: 0s;">眾神撥開了混沌的霧氣...</p>
            <p class="typewriter" style="--d: 4s;">賽琳握起筆，開始記錄這世間的呼吸。</p>
            <p class="typewriter" style="--d: 8s;">這裡是 Habri'a，一切故事的起源。</p>
        </div>
    </div>

    <div id="main-hub">
        <header class="hub-header">
            <h1 class="world-title">Habri'a</h1>
            <p class="subtitle">—— 觀測者的導引視窗 ——</p>
        </header>

        <nav class="hex-nav">
            <a href="myth.html" class="nav-item"><span>神話</span></a>
            <a href="map.html" class="nav-item"><span>地圖</span></a>
            <a href="library.html" class="nav-item"><span>世界樹圖書館</span></a>
            <a href="journal.html" class="nav-item"><span>賽琳手記</span></a>
            <a href="characters.html" class="nav-item"><span>人物誌</span></a>
            <a href="lexicon.html" class="nav-item"><span>註記</span></a>
        </nav>

        <div class="scroll-hint">
            <span>向下探尋深淵</span>
            <div class="arrow">↓</div>
        </div>
    </div>

    <section id="afterlife-layer">
        <div class="mirror-shards"></div>
        
        <div id="rules-paper" class="paper">
            <div class="paper-content">
                <h2>死後世界：守則</h2>
                <hr>
                <div class="rules-text">
                    <p>1. 放下生者的重量。</p>
                    <p>2. 越過忘川者，不可回頭。</p>
                    <p>3. 聲音在此處是禁忌。</p>
                </div>
                <p class="seal">—— 審判者署名</p>
            </div>
        </div>

        <div class="afterlife-title">此處為終焉，亦是起始</div>
    </section>

    <script src="script.js"></script>
</body>
</html>
