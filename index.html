.card-wrap { perspective: 900px; cursor: pointer; }
.card-inner {
  position: relative;
  width: 100%;
  padding-top: 175%;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(.4, 0, .2, 1);
}

.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);

}

.tarot-frame {
  position: absolute; inset: 8px;
  border: 1px solid #986db244;
  border-radius: 6px;
  pointer-events: none;
}

.tarot-corner {
  position: absolute; width: 14px; height: 14px;

}
.tc-tl { top: 4px; left: 4px; border-width: 1.5px 0 0 1.5px; }

.tc-br { bottom: 4px; right: 4px; border-width: 0 1.5px 1.5px 0; }

.tarot-img { width: 100%; height: 78%; object-fit: cover; object-position: top center; display: block; }

.tarot-bot {

.tarot-name { font-family: 'Shippori Mincho B1', serif; font-size: 13px; font-weight: 500; color: #e7e0be; letter-spacing: 0.05em; text-align: center; }

/* ── 背面：角色卡（配色改為你的網頁風） ── */
.card-back {
  transform: rotateY(180deg);
  background: #ffffff;
  border: 1px solid #986db222;
  display: flex; flex-direction: column;
}

.back-img { width: 100%; height: 50%; object-fit: cover; object-position: top center; display: block; }

.back-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

/* 針對 iPortfolio 容器的 Grid 微調 */
.grid { 
  display: grid; 
  /* 自動填充，確保在不同螢幕寬度下都能對齊 */

var tarotGrid = document.getElementById('tarot-grid');

tarotCards.forEach(function(c) {
  var wrap = document.createElement('div');
  wrap.className = 'card-wrap';

  var kwHtml = c.kws.map(function(k){
    return '<span class="kw '+k.c+'">'+k.t+'</span>';
  }).join('');

  wrap.innerHTML = `
    <div class="card-inner">
      <div class="card-face card-front">
        <img class="tarot-img" src="${c.img}" alt="${c.name}">
        <div class="tarot-bot">
          <span class="tarot-num">${c.num}</span>
          <span class="tarot-name">${c.name}</span>
        </div>
        <div class="tarot-frame">
          <div class="tarot-corner tc-tl"></div><div class="tarot-corner tc-tr"></div>
          <div class="tarot-corner tc-bl"></div><div class="tarot-corner tc-br"></div>
        </div>
      </div>
      <div class="card-face card-back">
        <img class="back-img" src="${c.img}" alt="${c.name}">
        <div class="back-body">
          <span class="world-tag">${c.world}</span>
          <p class="back-name">${c.name}</p>
          ${c.sub ? `<p class="back-sub">${c.sub}</p>` : ''}
          <p class="back-desc">${c.desc}</p>
          <div class="kws">${kwHtml}</div>
        </div>
        <p class="hint">雙擊進入詳情</p>
      </div>
    </div>`;

  // --- 互動邏輯 ---
  
  // 單擊：切換翻面
  wrap.addEventListener('click', function() {
    wrap.classList.toggle('flipped');
  });

  // 雙擊：跳轉頁面（僅限翻面狀態下）
  wrap.addEventListener('dblclick', function(e) {
    if (wrap.classList.contains('flipped')) {
      window.open(c.link, '_blank');
    }
  });

  tarotGrid.appendChild(wrap);
});
</script>
