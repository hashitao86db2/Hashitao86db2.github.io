<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>finder</title>
<style>
    :root {
        --mint-light:  #e8f5ef;
        --mint-mid:    #b8deca;
        --mint-dark:   #5fad8a;
        --choco-dark:  #3b2212;
        --choco-mid:   #7a4e2d;
        --folder-top:  #a8d5be;
        --folder-body: #c9eadb;
        --border:      #c2d8cb;
        --bg-dot:      #7a4e2d;
        --bg-base:     #edf7f1;
    }

    * { box-sizing: border-box; }

    body, html {
        margin: 0; padding: 0; min-height: 100%;
        display: flex; justify-content: center; align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: var(--bg-base);
        background-image: radial-gradient(circle, var(--bg-dot) 1.5px, transparent 1.5px);
        background-size: 20px 20px;
    }

    .finder-window {
        width: 92vw; max-width: 780px;
        height: 88vh; max-height: 580px;
        background: var(--mint-light); border-radius: 12px;
        box-shadow: 0 2px 0 rgba(0,0,0,0.08), 0 8px 30px rgba(59,34,18,0.18);
        overflow: hidden; display: flex; flex-direction: column;
        border: 1px solid var(--border); margin: 20px 0;
    }

    .titlebar {
        height: 44px; flex-shrink: 0;
        display: flex; align-items: center; gap: 8px; padding: 0 14px;
        background: var(--mint-mid); border-bottom: 1px solid var(--border);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green  { background: #28c840; }
    .titlebar-title {
        flex: 1; text-align: center; font-size: 13px; font-weight: 600;
        color: var(--choco-mid); margin-right: 54px;
    }

    .finder-body { flex: 1; display: flex; min-height: 0; }

    .sidebar {
        width: 148px; flex-shrink: 0;
        background: var(--mint-mid); border-right: 1px solid var(--border);
        padding: 14px 10px; overflow-y: auto;
        font-size: 12.5px; color: var(--choco-dark);
        transition: width 0.2s ease, opacity 0.2s ease;
    }
    .sidebar.sidebar-hidden { width: 0; opacity: 0; padding: 0; overflow: hidden; }
    .sidebar-label {
        font-size: 10.5px; font-weight: 700; color: var(--choco-mid);
        letter-spacing: 0.6px; margin: 14px 6px 6px; white-space: nowrap;
    }
    .sidebar-label:first-child { margin-top: 0; }
    .sidebar-item {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 6px; border-radius: 6px; cursor: default; white-space: nowrap;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.4); }
    .sidebar-item .ico { font-size: 13px; width: 16px; text-align: center; }

    .content-area { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--mint-light); }

    .content-toolbar {
        height: 38px; flex-shrink: 0;
        display: flex; align-items: center; gap: 6px; padding: 0 14px;
        border-bottom: 1px solid var(--border); overflow: hidden;
    }
    .back-btn {
        border: none; background: none; font-size: 16px; color: var(--mint-dark);
        cursor: pointer; padding: 4px 6px; border-radius: 6px; font-weight: 700;
        flex-shrink: 0; visibility: hidden;
    }
    .back-btn:hover { background: rgba(95,173,138,0.15); }
    .breadcrumb {
        font-size: 12px; color: var(--choco-mid);
        flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .breadcrumb .crumb { cursor: default; }
    .breadcrumb .sep { margin: 0 4px; color: #aaa; }

    .content-scroll {
        flex: 1; overflow-y: auto; padding: 20px;
        scrollbar-width: thin; scrollbar-color: var(--mint-mid) transparent;
        position: relative;
    }
    .content-scroll::-webkit-scrollbar { width: 5px; }
    .content-scroll::-webkit-scrollbar-thumb { background: var(--mint-mid); border-radius: 4px; }

    /* ===== 資料夾格狀（共用於根目錄與子資料夾） ===== */
    .folder-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 20px 10px; animation: fadeIn 0.22s ease;
    }
    .folder-item {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        cursor: pointer; padding: 6px; border-radius: 8px;
        border: 1.5px solid transparent; user-select: none; transition: background 0.15s;
    }
    .folder-item:hover   { background: rgba(95,173,138,0.1); }
    .folder-item.selected { background: rgba(95,173,138,0.15); border-color: var(--mint-dark); }

    .folder-icon { width: 58px; height: 46px; position: relative; }
    .folder-icon::before {
        content: ""; position: absolute; top: 0; left: 0;
        width: 26px; height: 9px; background: var(--folder-top); border-radius: 4px 4px 0 0;
    }
    .folder-icon::after {
        content: ""; position: absolute; top: 7px; left: 0;
        width: 58px; height: 39px; background: var(--folder-body);
        border-radius: 0 4px 4px 4px; box-shadow: 0 2px 6px rgba(59,34,18,0.12);
    }
    .folder-name { font-size: 12px; color: var(--choco-dark); text-align: center; word-break: break-word; }

    /* ===== 內容頁（文字 or 圖片） ===== */
    .content-page { animation: fadeIn 0.22s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .page-title { font-size: 18px; font-weight: 700; margin: 0 0 16px; color: var(--choco-dark); }

    .photo-grid { columns: 3; column-gap: 10px; }
    @media (max-width: 500px) { .photo-grid { columns: 2; } }

    .photo-item {
        break-inside: avoid; margin-bottom: 10px; border-radius: 8px;
        overflow: hidden; background: var(--mint-mid);
        border: 1.5px solid var(--border); cursor: pointer;
    }
    .photo-item img { width: 100%; display: block; object-fit: cover; transition: transform 0.3s ease; }
    .photo-item:hover img { transform: scale(1.04); }
    .photo-placeholder {
        width: 100%; background: var(--mint-mid);
        display: flex; align-items: center; justify-content: center;
        color: var(--choco-mid); font-size: 22px;
    }

    .page-body { font-size: 13.5px; line-height: 1.85; color: var(--choco-dark); }
    .page-body ul { padding-left: 18px; margin: 8px 0; }
    .page-body li { margin-bottom: 5px; }

    /* ===== 密碼彈窗 ===== */
    .pw-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center;
        z-index: 900; padding: 20px; box-sizing: border-box;
        opacity: 0; transition: opacity 0.2s ease;
    }
    .pw-overlay.show { opacity: 1; }
    .pw-box {
        background: white; border-radius: 16px; padding: 28px 24px;
        width: 100%; max-width: 290px; display: flex; flex-direction: column; gap: 14px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        transform: scale(0.94); transition: transform 0.2s ease;
    }
    .pw-overlay.show .pw-box { transform: scale(1); }
    .pw-box h3 { margin: 0; font-size: 15px; font-weight: 800; text-align: center; color: var(--mint-dark); }
    .pw-box p { margin: 0; font-size: 12px; color: #999; text-align: center; }
    .pw-input-wrap { display: flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
    .pw-input-wrap input {
        flex: 1; padding: 10px 12px; border: none; outline: none;
        font-size: 14px; font-family: inherit; letter-spacing: 2px;
    }
    .pw-toggle { background: none; border: none; padding: 0 12px; cursor: pointer; color: #aaa; font-size: 15px; }
    .pw-error { font-size: 12px; color: #e03c3c; text-align: center; min-height: 16px; }
    .pw-actions { display: flex; gap: 8px; }
    .pw-actions button {
        flex: 1; padding: 9px; border-radius: 20px; border: none;
        cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .btn-confirm { background: var(--mint-dark); color: white; }
    .btn-cancel-pw { background: #eee; color: #333; }

    /* ===== Lightbox ===== */
    .lb-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.88);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000; opacity: 0; transition: opacity 0.25s ease; cursor: zoom-out;
    }
    .lb-overlay.show { opacity: 1; }
    .lb-img {
        max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 6px;
        transform: scale(0.92); transition: transform 0.25s ease; cursor: default;
    }
    .lb-overlay.show .lb-img { transform: scale(1); }
    .lb-close {
        position: absolute; top: 16px; right: 20px;
        background: rgba(255,255,255,0.15); border: none; color: white;
        font-size: 22px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
        display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .lb-close:hover { background: rgba(255,255,255,0.28); }
    .lb-prev, .lb-next {
        position: absolute; top: 50%; transform: translateY(-50%);
        background: rgba(255,255,255,0.15); border: none; color: white;
        font-size: 20px; width: 40px; height: 40px; border-radius: 50%;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: background 0.2s;
    }
    .lb-prev { left: 14px; }
    .lb-next { right: 14px; }
    .lb-prev:hover, .lb-next:hover { background: rgba(255,255,255,0.28); }
    .lb-prev.nav-hidden, .lb-next.nav-hidden { display: none; }

    .hidden { display: none !important; }
</style>
</head>
<body>

<div class="finder-window">
    <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="titlebar-title">Recent</span>
    </div>

    <div class="finder-body">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-label">Favorites</div>
            <div class="sidebar-item"><span class="ico">📡</span><span>Airdrop</span></div>
            <div class="sidebar-item"><span class="ico">🕓</span><span>Recents</span></div>
            <div class="sidebar-item"><span class="ico">📄</span><span>Documents</span></div>
            <div class="sidebar-item"><span class="ico">☁️</span><span>iCloud</span></div>
            <div class="sidebar-item"><span class="ico">📚</span><span>Books</span></div>
            <div class="sidebar-label">iCloud</div>
            <div class="sidebar-item"><span class="ico">⬇️</span><span>Downloads</span></div>
            <div class="sidebar-item"><span class="ico">🎵</span><span>Music</span></div>
            <div class="sidebar-item"><span class="ico">🧭</span><span>Safari</span></div>
        </aside>

        <div class="content-area">
            <div class="content-toolbar">
                <button class="back-btn" id="backBtn">‹</button>
                <div class="breadcrumb" id="breadcrumb"><span class="crumb">Recent</span></div>
            </div>
            <div class="content-scroll" id="contentScroll"></div>
        </div>
    </div>
</div>

<!-- 密碼彈窗 -->
<div class="pw-overlay hidden" id="pwOverlay">
    <div class="pw-box">
        <h3>🔒 密碼確認</h3>
        <p>輸入一次即可全頁解鎖<br><span style="color:var(--mint-dark);">HINT:たこさんの誕生日</span></p>
        <div class="pw-input-wrap">
            <input type="password" id="pwInput" placeholder="輸入密碼" autocomplete="off">
            <button class="pw-toggle" id="pwToggle">👁</button>
        </div>
        <div class="pw-error" id="pwError"></div>
        <div class="pw-actions">
            <button class="btn-cancel-pw" id="pwCancel">取消</button>
            <button class="btn-confirm" id="pwConfirm">確認</button>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div class="lb-overlay hidden" id="lbOverlay">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-prev" id="lbPrev">‹</button>
    <img class="lb-img" id="lbImg" src="" alt="">
    <button class="lb-next" id="lbNext">›</button>
</div>

<script>
/* ================================================================
   密碼設定
================================================================ */
const CORRECT_PASSWORD = '0910';

/* ================================================================
   資料結構定義
   ----------------------------------------------------------------
   每個 node 的格式：
   {
     id:      唯一 ID（字串，英數字 + 連字號）,
     label:   顯示名稱,
     type:    'folder-list' | 'photos' | 'text',

     // type === 'folder-list'：裡面放子資料夾，children 是 node 陣列
     children: [ ...nodes ],

     // type === 'photos'：放圖片
     photos: [
       'img/路徑/圖片.jpg',
       ...
     ],

     // type === 'text'：放文字（HTML 字串）
     html: '<p>內容</p>',
   }

   新增資料夾方式：
   ① 在 children 陣列裡加一個 node 物件即可
   ② 支援無限層巢狀，type:'folder-list' 的 node 可以繼續有 children
================================================================ */
const ROOT = {
    id: 'root', label: 'Recent', type: 'folder-list',
    children: [

        {
            id: 'main', label: 'Read me', type: 'text',
            html: '<p>半的娃娃周邊照片存檔處<br>今日はどこへお出かけしよう♪</p>'
        },

        /* ── Hoshirube Sho：裡面有子資料夾 ── */
        {
            id: 'GO', label: '現地記錄', type: 'folder-list',
            children: [
                {
                    id: 'GO-にじさじ百貨店　2024', label: 'にじさんじ百貨店　2024', type: 'photos',
                    photos: [
                        /* 把圖片路徑填進來，例如：
                        'img/rube/2024/001.jpg',
                        'img/rube/2024/002.jpg', */
                    ]
                },
                {
                    id: 'GO-NIJI FES 2025', label: 'NIJI FES 2025', type: 'photos',
                    photos: [
                        /* 'img/rube/2025/001.jpg', */
                    ]
                },
                {
                    id: 'GO-にじさんじ フェス展 TAIPEI', label: 'にじさんじ フェス展 TAIPEI', type: 'photos',
                    photos: [
                        /* 'img/rube/2025/001.jpg', */
                    ]
                },
                {
                    id: 'GO-NIJISANJI 8TH', label: 'NIJISANJI 8TH', type: 'photos',
                    photos: [
                        /* 'img/rube/2025/001.jpg', */
                    ]
                },
                {
                    id: 'GO-CR FES&LIVE 2026', label: 'CR FES&LIVE 2026', type: 'photos',
                    photos: [
                        /* 'img/rube/2025/001.jpg', */
                    ]
                },
                /* ── 繼續加子資料夾：複製上面的 {} 區塊貼在這裡 ── */
            ]
        },

         /* ── Hoshirube Sho ── */
        {
            id: 'rube', label: 'Hoshirube Sho', type: 'photos',
            photos: [
                /* 'img/vani/001.jpg', */
            ]
        },

        /* ── VanilLa ── */
        {
            id: 'vani', label: 'VanilLa', type: 'photos',
            photos: [
                /* 'img/vani/001.jpg', */
            ]
        },

        /* ── Sumeragi Reo ── */
        {
            id: 'reo', label: 'Sumeragi Reo', type: 'photos',
            photos: []
        },

        /* ── Osaka Sogo ── */
        {
            id: 'sogo', label: 'Osaka Sogo', type: 'photos',
            photos: []
        },

        /* ── Aoi Hinata ── */
        {
            id: 'hinata', label: 'Aoi Hinata', type: 'photos',
            photos: []
        },

        /* ── Nishizono Renga ── */
        {
            id: 'renga', label: 'Nishizono Renga', type: 'photos',
            photos: []
        },

        /* ── Pikmin ── */
        {
            id: 'pikmin', label: 'Pikmin', type: 'photos',
            photos: []
        },

        /* ── 新增更多根目錄資料夾：在這裡加 { id, label, type, ... } ── */
    ]
};

/* ================================================================
   導航系統
================================================================ */
const sidebar      = document.getElementById('sidebar');
const backBtn      = document.getElementById('backBtn');
const breadcrumbEl = document.getElementById('breadcrumb');
const contentScroll = document.getElementById('contentScroll');

// navStack：存放從根到目前位置的 node 路徑
// navStack[0] 一定是 ROOT，最後一個是目前正在看的 node
let navStack = [ROOT];
let selectedItem = null;

// 找 node by id（深度優先搜尋）
function findNode(id, node = ROOT) {
    if (node.id === id) return node;
    if (node.children) {
        for (const c of node.children) {
            const r = findNode(id, c);
            if (r) return r;
        }
    }
    return null;
}

function currentNode() { return navStack[navStack.length - 1]; }

function renderBreadcrumb() {
    breadcrumbEl.innerHTML = navStack
        .map(n => `<span class="crumb">${n.label}</span>`)
        .join('<span class="sep">/</span>');
    backBtn.style.visibility = navStack.length > 1 ? 'visible' : 'hidden';
}

function shouldHideSidebar(node) {
    // 隱藏側邊欄：純圖片頁，或子資料夾列表（非根目錄）
    return node.type === 'photos' || (node.type === 'folder-list' && node.id !== 'root');
}

function renderNode(node) {
    contentScroll.innerHTML = '';

    if (node.type === 'folder-list') {
        const grid = document.createElement('div');
        grid.className = 'folder-grid';
        (node.children || []).forEach(child => {
            const item = document.createElement('div');
            item.className = 'folder-item';
            item.innerHTML = `<div class="folder-icon"></div><div class="folder-name">${child.label}</div>`;
            item.addEventListener('click', () => {
                if (selectedItem) selectedItem.classList.remove('selected');
                selectedItem = item;
                item.classList.add('selected');
            });
            item.addEventListener('dblclick', () => navigateTo(child.id));
            grid.appendChild(item);
        });
        contentScroll.appendChild(grid);

    } else if (node.type === 'photos') {
        const page = document.createElement('div');
        page.className = 'content-page';
        const title = document.createElement('h2');
        title.className = 'page-title';
        title.textContent = node.label;
        page.appendChild(title);

        if (!node.photos || node.photos.length === 0) {
            const empty = document.createElement('p');
            empty.style.cssText = 'color:#aaa;font-size:13px;';
            empty.textContent = '（尚無圖片）';
            page.appendChild(empty);
        } else {
            const grid = document.createElement('div');
            grid.className = 'photo-grid';
            node.photos.forEach(src => {
                const item = document.createElement('div');
                item.className = 'photo-item';
                const img = document.createElement('img');
                img.src = src;
                img.loading = 'lazy';
                item.appendChild(img);
                item.addEventListener('click', () => {
                    if (!item.querySelector('img')) return;
                    if (unlocked) openLightboxFromEl(item, node.photos);
                    else showPwModal(item, node.photos);
                });
                grid.appendChild(item);
            });
            page.appendChild(grid);
        }
        contentScroll.appendChild(page);

    } else if (node.type === 'text') {
        const page = document.createElement('div');
        page.className = 'content-page';
        const title = document.createElement('h2');
        title.className = 'page-title';
        title.textContent = node.label;
        page.appendChild(title);
        const body = document.createElement('div');
        body.className = 'page-body';
        body.innerHTML = node.html || '';
        page.appendChild(body);
        contentScroll.appendChild(page);
    }

    // 側邊欄
    if (shouldHideSidebar(node)) sidebar.classList.add('sidebar-hidden');
    else sidebar.classList.remove('sidebar-hidden');

    renderBreadcrumb();
    selectedItem = null;
}

function navigateTo(id) {
    const node = findNode(id);
    if (!node) return;
    navStack.push(node);
    renderNode(node);
}

function navigateBack() {
    if (navStack.length <= 1) return;
    navStack.pop();
    renderNode(currentNode());
}

backBtn.addEventListener('click', navigateBack);

// 初始渲染
renderNode(ROOT);

/* ================================================================
   密碼
================================================================ */
let unlocked = false;
let pendingImgEl = null;
let pendingPhotos = [];

const pwOverlay = document.getElementById('pwOverlay');
const pwInput   = document.getElementById('pwInput');
const pwToggle  = document.getElementById('pwToggle');
const pwError   = document.getElementById('pwError');
const pwCancel  = document.getElementById('pwCancel');
const pwConfirm = document.getElementById('pwConfirm');

function showPwModal(el, photos) {
    pendingImgEl = el;
    pendingPhotos = photos;
    pwInput.value = ''; pwError.textContent = '';
    pwOverlay.classList.remove('hidden');
    requestAnimationFrame(() => pwOverlay.classList.add('show'));
    setTimeout(() => pwInput.focus(), 100);
}
function hidePwModal() {
    pwOverlay.classList.remove('show');
    setTimeout(() => pwOverlay.classList.add('hidden'), 200);
}

pwToggle.addEventListener('click', () => {
    pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
});

function attemptUnlock() {
    if (pwInput.value === CORRECT_PASSWORD) {
        unlocked = true; hidePwModal();
        if (pendingImgEl) openLightboxFromEl(pendingImgEl, pendingPhotos);
    } else {
        pwError.textContent = '密碼錯誤，請再試一次';
        pwInput.value = ''; pwInput.focus();
    }
}

pwConfirm.addEventListener('click', attemptUnlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') attemptUnlock(); });
pwCancel.addEventListener('click', hidePwModal);
pwOverlay.addEventListener('click', e => { if (e.target === pwOverlay) hidePwModal(); });

/* ================================================================
   Lightbox
================================================================ */
const lbOverlay = document.getElementById('lbOverlay');
const lbImg     = document.getElementById('lbImg');
const lbClose   = document.getElementById('lbClose');
const lbPrev    = document.getElementById('lbPrev');
const lbNext    = document.getElementById('lbNext');
let lbImages = [], lbIndex = 0;

function openLightboxFromEl(el, photos) {
    lbImages = photos;
    const src = el.querySelector('img')?.src || '';
    lbIndex = lbImages.indexOf(src);
    if (lbIndex < 0) lbIndex = 0;
    if (lbImages.length === 0) return;
    lbImg.src = lbImages[lbIndex];
    updateLbNav();
    lbOverlay.classList.remove('hidden');
    requestAnimationFrame(() => lbOverlay.classList.add('show'));
}
function closeLightbox() {
    lbOverlay.classList.remove('show');
    setTimeout(() => { lbOverlay.classList.add('hidden'); lbImg.src = ''; }, 250);
}
function updateLbNav() {
    lbPrev.classList.toggle('nav-hidden', lbIndex <= 0);
    lbNext.classList.toggle('nav-hidden', lbIndex >= lbImages.length - 1);
}

lbClose.addEventListener('click', closeLightbox);
lbOverlay.addEventListener('click', e => { if (e.target === lbOverlay) closeLightbox(); });
lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; lbImg.src = lbImages[lbIndex]; updateLbNav(); } });
lbNext.addEventListener('click', () => { if (lbIndex < lbImages.length - 1) { lbIndex++; lbImg.src = lbImages[lbIndex]; updateLbNav(); } });

document.addEventListener('keydown', e => {
    if (lbOverlay.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft'  && lbIndex > 0)                   { lbIndex--; lbImg.src = lbImages[lbIndex]; updateLbNav(); }
    if (e.key === 'ArrowRight' && lbIndex < lbImages.length - 1) { lbIndex++; lbImg.src = lbImages[lbIndex]; updateLbNav(); }
});
</script>
</body>
</html>
