    <style>
        :root {
            --bg-pattern: #f0f8ff;
            --stripe-color: #d0e7ff;
            --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --border-color: #dbdbdb;
        }

        /* 1. 外層背景與置中 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-pattern);
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 15px,
                var(--stripe-color) 15px,
                var(--stripe-color) 17px
            );
        }

        /* 2. 中間的正方形容器 */
        .square-container {
            width: 90vw;
            max-width: 550px;
            aspect-ratio: 1 / 1;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 3. 可捲動的內容區 */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            scrollbar-width: none;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        /* 4. 個人檔案頭部 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 5px;
        }
        .profile-pic {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #eee;
            margin-right: 15px;
            object-fit: cover;
        }
        .user-info h2 { font-size: 18px; margin: 0; }
        .user-info p { font-size: 13px; color: #666; margin: 5px 0 0; }

        /* 5. 精選動態區 (分類按鈕) */
        .highlights {
            display: flex;
            gap: 15px;
            padding: 10px 0;
            overflow-x: auto;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 15px;
        }
        .highlight-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 65px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .highlight-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            padding: 2px;
            background: white;
            margin-bottom: 5px;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .highlight-item.active .highlight-circle {
            border: 2px solid transparent;
            background-image: linear-gradient(white, white), var(--ig-gradient);
            background-origin: border-box;
            background-clip: content-box, border-box;
            transform: scale(1.08);
        }
        .highlight-name { font-size: 10px; font-weight: 600; color: #262626; }

        /* 6. 前言文字區 (ALL 模式下顯示) */
        #welcome-text {
            padding: 20px 10px;
            animation: fadeIn 0.5s ease;
        }
        .text-box {
            background: #fafafa;
            border: 1px dashed #dbdbdb;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            line-height: 1.8;
            color: #444;
            font-size: 14px;
        }

        /* 7. 貼文網格 */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .post {
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            overflow: hidden;
            border-radius: 2px;
        }
        .post img { width: 100%; height: 100%; object-fit: cover; }

        /* 輔助類 */
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

    <script>loading="lazy"
        const filters = document.querySelectorAll('.highlight-item');
        const posts = document.querySelectorAll('.post');
        const welcomeText = document.getElementById('welcome-text');
        const postGrid = document.getElementById('post-grid');

        filters.forEach(filter => {
            filter.addEventListener('click', () => {
                filters.forEach(f => f.classList.remove('active'));
                filter.classList.add('active');

                const target = filter.getAttribute('data-target');

                if (target === 'all') {
                    // 顯示文字區，隱藏圖片網格
                    welcomeText.classList.remove('hidden');
                    postGrid.classList.add('hidden');
                } else {
                    // 隱藏文字區，顯示圖片網格並過濾
                    welcomeText.classList.add('hidden');
                    postGrid.classList.remove('hidden');

                    posts.forEach(post => {
                        const category = post.getAttribute('data-category');
                        if (category === target) {
                            post.classList.remove('hidden');
                        } else {
                            post.classList.add('hidden');
                        }
                    });
                }
            });
        });
    </script>
