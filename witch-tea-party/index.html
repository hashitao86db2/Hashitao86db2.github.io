<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Aelian's Tea Party Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfaf3;
            --gold: #d4af37;
            --bg-color: #2b1b3d; 
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 2px 2px, rgba(212,175,55,0.1) 1px, transparent 0);
            background-size: 32px 32px;
            display: flex;
            flex-direction: column; /* 改為垂直排列以放置下方文字 */
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
        }

        /* 蕾絲裝飾邊界 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 20px solid transparent;
            border-image: radial-gradient(circle, var(--gold) 2px, transparent 2px) 20% round;
            opacity: 0.2;
            pointer-events: none;
        }

        .envelope-container {
            position: relative;
            width: 400px;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 10;
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: #b58d20;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .flap {
            position: absolute;
            top: 0; left: 0; width: 0; height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 150px solid #d4af37;
            transform-origin: top;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .pocket {
            position: absolute;
            bottom: 0; left: 0; width: 0; height: 0;
            border-left: 200px solid #c29a2d;
            border-right: 200px solid #c29a2d;
            border-bottom: 140px solid #a67c1a;
            z-index: 3;
        }

        .envelope-text {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            color: rgba(255,255,255,0.9);
            font-size: 48px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            transition: opacity 0.4s;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 360px;
            height: 240px;
            background: var(--paper);
            border: 5px double var(--gold);
            z-index: 2;
            padding: 30px;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s;
            box-sizing: border-box;
            opacity: 0;
        }

        .opened .flap { transform: rotateX(180deg); z-index: 1; }
        .opened .letter { transform: translateY(-160px); opacity: 1; z-index: 5; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .opened .envelope-text { opacity: 0; }

        .option-btn {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            border: 1px solid var(--gold);
            color: #8b7355;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            background: rgba(255,255,255,0.5);
        }

        .option-btn:hover { background: var(--gold); color: white; letter-spacing: 1px; }

        .wax-seal {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: #8b0000;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 24px;
            transition: opacity 0.4s;
        }

        /* 下方說明文字 */
        .footer-text {
            margin-top: 40px;
            color: var(--gold);
            font-size: 18px;
            letter-spacing: 4px;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            animation: fadeInText 2s ease-in-out;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 0.8; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="envelope-container" id="envelope" onclick="this.classList.toggle('opened')">
        <div class="envelope">
            <div class="envelope-text">Aelian</div>
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal">✵</div>
            
            <div class="letter">
                <h2 class="text-2xl font-bold text-yellow-900 mb-1" style="font-family: 'Great Vibes'; font-size: 36px;">Invitation</h2>
                <p class="text-xs text-gray-500 mb-4 italic">～ 來自時之縫隙的邀約 ～</p>
                <div class="space-y-2">
                    <button class="option-btn w-full" onclick="event.stopPropagation(); alert('這是一個由四位魔女守護的世界...')">✦ 世界觀 ✦</button>
                    <a href="witches.html" class="option-btn w-full" onclick="event.stopPropagation();">✦ 邀請名單 ✦</a>
                    <button class="option-btn w-full" onclick="event.stopPropagation(); alert('請先前往邀請名單翻閱她們的故事。')">✦ 故事回憶 ✦</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-text">
        一封來自時之魔女的茶會邀請函
    </div>

</body>
</html>
