<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Aelian's Tea Party Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfaf3;
            --gold: #d4af37;
            --bg-color: #2b1b3d; 
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 2px 2px, rgba(212,175,55,0.1) 1px, transparent 0);
            background-size: 32px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* 確保所有子元素水平置中 */
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Shippori Mincho B1', serif;
        }

        /* 蕾絲裝飾邊界 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 20px solid transparent;
            border-image: radial-gradient(circle, var(--gold) 2px, transparent 2px) 20% round;
            opacity: 0.2;
            pointer-events: none;
        }

        .envelope-container {
            position: relative;
            width: 400px;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 10;
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: #b58d20;
            box-shadow: 0 15px 45px rgba(0,0,0,0.7);
            overflow: hidden; /* 修正：防止信件在未開啟時溢出產生白色區塊 */
        }

        /* 當信封打開時，需要允許內容溢出以便信件升起 */
        .opened .envelope {
            overflow: visible;
        }

        .flap {
            position: absolute;
            top: 0; left: 0; width: 0; height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 150px solid #d4af37;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .pocket {
            position: absolute;
            bottom: 0; left: 0; width: 0; height: 0;
            border-left: 200px solid #c29a2d;
            border-right: 200px solid #c29a2d;
            border-bottom: 140px solid #a67c1a;
            z-index: 3;
        }

        .envelope-text {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            color: rgba(255,255,255,0.95);
            font-size: 52px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.5);
            transition: opacity 0.4s;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 360px;
            height: 300px;
            background: var(--paper);
            border: 5px double var(--gold);
            z-index: 2;
            padding: 35px 30px 50px 30px;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s;
            box-sizing: border-box;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .opened .flap { transform: rotateX(180deg); z-index: 1; }
        .opened .letter { 
            transform: translateY(-180px); 
            opacity: 1; 
            z-index: 5; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
        }
        .opened .envelope-text { opacity: 0; }

        .option-btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: 1px solid var(--gold);
            color: #7a6144;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s;
            text-decoration: none;
            background: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }

        .option-btn:hover { 
            background: var(--gold); 
            color: white; 
            letter-spacing: 2px;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
        }

        .wax-seal {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #a50000, #700000);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 28px;
            transition: opacity 0.4s;
            border: 1px solid #5a0000;
        }

        /* 下方說明文字修正 */
        .footer-text {
            margin-top: 50px;
            color: var(--gold);
            font-size: 19px;
            font-weight: 400;
            letter-spacing: 5px;
            opacity: 0.9;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
            animation: fadeInText 2.5s ease-in-out;
            text-align: center; /* 修正：確保文字內容置中 */
            width: 100%; /* 修正：確保佔滿寬度以便置中 */
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 0.9; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="envelope-container" id="envelope" onclick="this.classList.toggle('opened')">
        <div class="envelope">
            <div class="envelope-text">Aelian</div>
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal">✵</div>
            
            <div class="letter">
                <div>
                    <h2 class="text-3xl font-bold text-yellow-900 mb-1" style="font-family: 'Great Vibes';">Invitation</h2>
                    <p class="text-xs text-gray-500 mb-6 italic" style="letter-spacing: 2px;">～ 來自時之縫隙的邀約 ～</p>
                </div>
                
                <div class="options">
                    <button class="option-btn" onclick="event.stopPropagation(); alert('世界觀正在編織中...')">✦ 世界觀 ✦</button>
                    <a href="witches.html" class="option-btn" onclick="event.stopPropagation();">✦ 邀請名單 ✦</a>
                    <button class="option-btn" onclick="event.stopPropagation(); alert('記憶尚未在此處凝結。')">✦ 故事回憶 ✦</button>
                </div>
                <div class="h-4"></div> 
            </div>
        </div>
    </div>

    <div class="footer-text">
        一封來自時之魔女的茶會邀請函
    </div>

</body>
</html>
