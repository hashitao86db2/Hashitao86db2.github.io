<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Aelian's Tea Party Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 匯入金魚燈籠字體 */
        @font-face {
            font-family: 'KingyoLantern';
            src: url('kingyolanternmini.otf') format('opentype');
        }

        @font-face {
            font-family: 'Hangyaku';
            src: url('Hangyaku-G3rpg.ttf') format('opentype');
        }

        :root {
            --paper: #fdfaf3; /* 信件紙張色 */
            --gold: #d4af37; /* 金色裝飾 */
            --envelope-green: #1a2f23; /* 墨綠色本體 */
            --envelope-flap: #243d2f; /* 稍亮的墨綠蓋子 */
            --bg-beige: #f5f2e8; /* 優雅米黃色背景 */
        }

        body {
            background-color: var(--bg-beige);
            /* 米黃色背景搭配淡金色微小點狀紋理 */
            background-image: radial-gradient(circle at 2px 2px, rgba(212,175,55,0.15) 1px, transparent 0);
            background-size: 32px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Shippori Mincho B1', serif;
        }

                /* 調整大標題容器 */
        .main-title {
            position: absolute;
            top: 60px; /* 距離頂部，確保信件升起時有呼吸空間 */
            width: 100%;
            text-align: center;
            z-index: 20;
            color: #2d4a39;
            letter-spacing: 0.1rem;
        }

        /* 針對「魔女」兩個字的特殊設定 */
        .witch-text {
            font-family: 'Hangyaku', serif;
            font-size: 5rem; /* 讓這兩個字特別醒目 */
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
            text-shadow: 2px 2px 0px rgba(212, 175, 55, 0.2);
        }

        /* 針對其餘文字的設定 */
        .sub-text {
            font-family: 'KingyoLantern', serif;
            font-size: 3rem; /* 縮小一點，讓視覺重心在魔女二字 */
            font-weight: 700;
            display: inline-block;
            vertical-align: middle;
            opacity: 0.9;
        }

        /* 同時微調信封容器的間距 */
        .envelope-container {
            position: relative;
            width: 400px;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 10;
            margin-top: 120px; /* 增加推力，避免信件升起時蓋到標題 */
        }



        /* 蕾絲裝飾邊界改為深色 */
        body::before {
            content: "";
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 2px solid rgba(26, 47, 35, 0.1);
            background-image: radial-gradient(circle, rgba(212, 175, 55, 0.2) 1px, transparent 1px);
            background-size: 15px 15px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
            outline: 1px solid rgba(26, 47, 35, 0.05);
            outline-offset: 10px;
        }

        .envelope-container {
            position: relative;
            width: 400px;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 10;
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--envelope-green);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); /* 陰影讓它在米黃底上更立體 */
            overflow: hidden;
        }

        .opened .envelope { overflow: visible; }

        .flap {
            position: absolute;
            top: 0; left: 0; width: 0; height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 150px solid var(--envelope-flap);
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .pocket {
            position: absolute;
            bottom: 0; left: 0; width: 0; height: 0;
            border-left: 200px solid #1f382a;
            border-right: 200px solid #1f382a;
            border-bottom: 140px solid #16291e;
            z-index: 3;
        }

        .envelope-text {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            color: rgba(212, 175, 55, 0.9); /* 金色字體在墨綠底上非常顯眼 */
            font-size: 52px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            transition: opacity 0.4s;
        }

        .letter {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 360px;
            height: 300px;
            background: var(--paper);
            border: 5px double var(--gold);
            z-index: 2;
            padding: 35px 30px 50px 30px;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s;
            box-sizing: border-box;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .opened .letter { 
            transform: translateY(-180px); 
            opacity: 1; 
            z-index: 5; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            pointer-events: auto;
        }

        .opened .flap { transform: rotateX(180deg); z-index: 1; }
        .opened .envelope-text { opacity: 0; }

        .option-btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: 1px solid var(--gold);
            color: #7a6144;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s;
            text-decoration: none;
            background: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }

        .option-btn:hover { 
            background: var(--gold); 
            color: white; 
            letter-spacing: 2px;
        }

        .wax-seal {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px; height: 65px;
            background: radial-gradient(circle at 30% 30%, #8b0000, #5a0000); /* 實體圖那種暗紅封蠟 */
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            color: var(--gold);
            font-size: 28px;
            transition: opacity 0.4s;
            border: 1px solid #4a0000;
        }

        .footer-text {
            margin-top: 50px;
            color: #2d4a39; /* 配合標題的深墨綠 */
            font-size: 19px;
            letter-spacing: 5px;
            opacity: 0.8;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

        <h1 class="main-title">
        <span class="witch-text">魔女</span>
        <span class="sub-text">会で会いましょう</span>
    </h1>


    <div class="envelope-container" id="envelope" onclick="this.classList.toggle('opened')">
        <div class="envelope">
            <div class="envelope-text">Aelian</div>
            <div class="flap"></div>
            <div class="pocket"></div>
            <div class="wax-seal">✵</div>
            
            <div class="letter">
                <div>
                    <h2 class="text-3xl font-bold text-yellow-900 mb-1" style="font-family: 'Great Vibes';">Invitation</h2>
                    <p class="text-xs text-gray-500 mb-6 italic" style="letter-spacing: 2px;">～ 來自時之縫隙的邀約 ～</p>
                </div>
                
                <div class="options">
                    <a href="world.html" class="option-btn" onclick="event.stopPropagation();">✦ 世界觀 ✦</a>
                    <a href="witches.html" class="option-btn" onclick="event.stopPropagation();">✦ 邀請名單 ✦</a>
                    <a href="stories.html" class="option-btn" onclick="event.stopPropagation();">✦ 故事回憶 ✦</a>
                </div>
                <div class="h-4"></div> 
            </div>
        </div>
    </div>

    <div class="footer-text">
        一封來自時之魔女的茶會邀請函
    </div>

    <script>
        window.onpageshow = function(event) {
            if (event.persisted || true) {
                const envelope = document.getElementById('envelope');
                if (envelope) {
                    envelope.classList.remove('opened');
                }
            }
        };
    </script>
</body>
</html>
