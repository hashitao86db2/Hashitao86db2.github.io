<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出席魔女名冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-dark: #aa8a2e; }
        body { 
            font-family: 'Shippori Mincho B1', serif; 
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            min-height: 100vh; 
            margin: 0;
            background: #1a1a1a;
            color: white;
        }

        /* 主題背景 */
        .theme-default { background: #1a1a1a; }
        .theme-deepsea { background: radial-gradient(circle at center, #1e3a8a 0%, #020617 100%); color: #e0f2fe; }
        .theme-time { background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%); color: #d1fae5; }
        .theme-memory { background: radial-gradient(circle at center, #701a75 0%, #2e1065 100%); color: #fdf2f8; }
        .theme-herbal { background: radial-gradient(circle at center, #dcfce7 0%, #a3cfc4 100%); color: #064e3b; }

        /* 橢圓形畫框頭像 */
        .avatar-frame {
            width: 130px; 
            height: 170px;
            border-radius: 50% / 60%; /* 橢圓比例 */
            border: 3px solid var(--gold);
            outline: 1px solid var(--gold-dark);
            outline-offset: -8px; /* 內層細線 */
            cursor: pointer;
            transition: transform 0.4s;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .avatar-frame:hover { transform: translateY(-10px); }
        .avatar-frame img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .symbol-fallback { font-size: 50px; opacity: 0.8; }
        
        .flower-font { font-family: 'Great Vibes', cursive; color: var(--gold); }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
        }

        .data-label { font-weight: bold; color: var(--gold); margin-right: 8px; }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="theme-default" id="main-body">

    <a href="index.html" class="fixed top-8 left-8 z-50 text-gold opacity-60 hover:opacity-100 transition tracking-widest text-sm">← Back to Invite</a>

    <div class="container mx-auto px-6 py-16">
        
        <div id="witch-menu" class="text-center pt-20">
            <h1 class="flower-font mb-16 text-white" style="font-size: 60px;">The Witches</h1>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-12 justify-items-center">
                <div class="flex flex-col items-center gap-4" onclick="showDetail('time')">
                    <div class="avatar-frame">
                        <span class="symbol-fallback">⏳</span>
                    </div>
                    <p class="font-bold tracking-widest">時之魔女</p>
                    <p class="flower-font text-2xl">Aelian Santan</p>
                </div>
                <div class="flex flex-col items-center gap-4" onclick="showDetail('deepsea')">
                    <div class="avatar-frame">
                        <span class="symbol-fallback">🌊</span>
                    </div>
                    <p class="font-bold tracking-widest">深海魔女</p>
                    <p class="flower-font text-2xl">Lynis Monotor</p>
                </div>
                <div class="flex flex-col items-center gap-4" onclick="showDetail('memory')">
                    <div class="avatar-frame">
                        <span class="symbol-fallback">🍬</span>
                    </div>
                    <p class="font-bold tracking-widest">記憶魔女</p>
                    <p class="flower-font text-2xl">Unknown</p>
                </div>
                <div class="flex flex-col items-center gap-4" onclick="showDetail('herbal')">
                    <div class="avatar-frame">
                        <span class="symbol-fallback">🌿</span>
                    </div>
                    <p class="font-bold tracking-widest">草藥魔法師</p>
                    <p class="flower-font text-2xl">Caiel</p>
                </div>
            </div>
        </div>

        <div id="witch-detail" class="hidden max-w-4xl mx-auto fade-in">
            <button onclick="backToMenu()" class="mb-10 text-xs tracking-widest border border-gold/40 px-6 py-2 rounded-full hover:bg-gold/10 transition">← 返回名冊</button>
            <div class="glass-panel" id="detail-content"></div>
        </div>
    </div>

    <script>
        const witchesData = {
    deepsea: {
        theme: 'theme-deepsea',
        title: '深海魔女',
        name: '莉妮絲•莫諾托 (Lynis Monotor)',
        symbol: '🫧🫀',
        info: [
            { label: '外貌', value: '透明的身體、中間有一顆粉紅色心臟、頭髮是觸手狀（共10根），髮尾與指尖會散發螢光。身高約170cm（含鞋175cm）。' },
            { label: '人形樣貌', value: '白色及腰的長髮、藍瞳。' },
            { label: '年齡', value: '約500歲。' },
            { label: '種族', value: '非人、來自星空的深海海蛞蝓。' },
            { label: '屬性', value: '光' },
            { label: '個性', value: '神祕溫柔的大姊姊。但在看不爽的人茶裡加瀉藥。喜歡小孩，見到總會忍不住抱起來摸摸。常戴大帽子（據說帽子是可以吃人的大嘴巴）。' }
        ],
        child: {
            name: '努迪亞 Nudia',
            symbol: '🪸🌺',
            desc: `
                <p><span class="data-label">種族：</span>非人（也是海蛞蝓）</p>
                <p><span class="data-label">外貌：</span>鮮豔綠髮，髮尾紅色。嘴巴與頭髮同色，擁有鯊魚齒。</p>
                <p><span class="data-label">初見年齡：</span>出生後50天</p>
                <p><span class="data-label">背景：</span>迷路到魔女之家的孩子（出生後50日）。莉妮絲帶回扶養。對事物充滿好奇，十分樂天。</p>
            `
        }
    },
    time: { 
        theme: 'theme-time', 
        title: '時之魔女', 
        name: '艾利安 • 桑坦（Aelian Santan）', 
        symbol: '🌱⏳', 
        info: [
            { label: '外貌', value: '一頭黑色及腰的長直髮、前額有碎髮、翠綠色瞳孔、細長的眸子（眼尾微微上挑，睫毛很長）、總之兩個字「漂亮」。' }, // 這裡修正了引號與結尾
            { label: '年齡', value: '約450歲。' },
            { label: '種族', value: '非人、具體物種未知' },
            { label: '屬性', value: '草木' },
            { label: '個性', value: '看上去優雅矜持，但實際上矜持不過三秒鐘。喜歡花草植物，把自己的家裝飾的像植物園。也喜歡把自己打扮的美美的，覺得自己世界第一漂亮。喜歡喊別人親愛的。' }
        ],
        child: {
            name: '瑟希斯•桑坦 Sethis Santan',
            symbol: '❄️🦊',
            desc: `
                <p><span class="data-label">種族：</span>銀狐</p>
                <p><span class="data-label">外貌：</span>小小的狐狸糰子，銀色蓬鬆的毛髮、水藍色的眼睛</p>
                <p><span class="data-label">人形外貌：</span>銀色短髮、狐耳、圓溜溜但上挑的水色眸子（豎瞳）、有小虎牙、狐狸尾巴</p>
                <p><span class="data-label">初見年齡：</span>出生後30天</p>
                <p><span class="data-label">化形年齡：</span>三歲（三年）</p>
                <p><span class="data-label">個性：</span>很乖很聽話、偶爾會小調皮。因為幼時被父母拋棄所以非常缺乏安全感</p>
                <p><span class="data-label">背景：</span>艾利安在森林撿到後帶回去照顧，名字是艾利安取的、姓氏也是艾利安的</p>
            `
        }
    },
    memory: { theme: 'theme-memory', title: '記憶魔女', name: 'Unknown', symbol: '🍬', info: [{label:'狀態', value:'資料待補充...'}], child: null },
    herbal: { theme: 'herbal-herbal', title: '草藥魔法師', 
        name: '夏伊爾（Caiel）', 
        symbol: '🌿⚗️', 
        info: [
            { label: '外貌', value: '不高不矮、看著約17歲的年，總是穿著過長的白袍，一頭白髮漸層藍，總是亂糟糟的好看。有一雙藍黃的異色瞳' }, // 這裡修正了引號與結尾
            { label: '年齡', value: '不知'},
            { label: '種族', value: '半人半人外' },
            { label: '屬性', value: '反魔法' },
            { label: '個性', value: '屁孩，不過懂分寸。愛搗蛋，直話直說，個性開朗。' }
        ],
        friend: {
            name: '希洛 Ciro',
            symbol: '',
            desc: `
                <p><span class="data-label">種族：</span>雪貂</p>
                <p><span class="data-label">外貌：</span>白色雪貂，在肩上待著也不會很重</p>
                <p><span class="data-label">人形外貌：</span>白毛紅瞳的少年，比夏伊爾高出一點</p>
                <p><span class="data-label">屬性：</span>冰</p>
                <p><span class="data-label">背景：</span>是在瀕死之際被夏伊爾救回來的，有人形，但最常用動物的型態圈在夏伊爾的脖子那附近
很喜歡夏伊爾。
喜歡到用人形跟夏伊爾互動的時候大家都覺得你們有事情。
不過夏伊爾並沒有自覺，希洛也只是覺得他在保護夏伊爾而已。
只有希洛牽制的住夏伊爾。</p>
            `
        }
};
        
        function showDetail(key) {
            const data = witchesData[key];
            const body = document.getElementById('main-body');
            const menu = document.getElementById('witch-menu');
            const detail = document.getElementById('witch-detail');
            const content = document.getElementById('detail-content');

            body.className = data.theme;
            menu.classList.add('hidden');
            detail.classList.remove('hidden');

            let html = `
                <div class="text-center mb-12">
                    <span class="text-4xl">${data.symbol}</span>
                    <h1 class="text-3xl font-bold mt-4 tracking-widest">『${data.title}』</h1>
                    <h2 class="flower-font text-3xl mt-2">${data.name}</h2>
                </div>
                <div class="space-y-6 text-lg leading-relaxed mb-12">
                    ${data.info.map(item => `<p><span class="data-label">${item.label}：</span>${item.value}</p>`).join('')}
                </div>
            `;

            if(data.child) {
                html += `
                    <div class="border-t border-gold/20 pt-10 mt-10">
                        <h3 class="text-2xl font-bold mb-6 text-center tracking-widest">『孩子 - ${data.child.name}』 ${data.child.symbol}</h3>
                        <div class="space-y-4">${data.child.desc}</div>
                    </div>
                `;
            }

            if(data.friend) {
    html += `
        <div class="border-t border-gold/20 pt-10 mt-10">
            <h3 class="text-2xl font-bold mb-6 text-center tracking-widest">『朋友 - ${data.friend.name}』 ${data.friend.symbol}</h3>
            <div class="space-y-4">${data.friend.desc}</div>
        </div>
    `;
}

            html += `
                <div class="mt-16 flex flex-wrap justify-center gap-6">
                    <a href="stories.html" class="px-8 py-3 border border-gold/60 hover:bg-gold hover:text-white transition rounded-full text-sm tracking-widest">查看故事</a>
                </div>
            `;

            content.innerHTML = html;
            window.scrollTo(0,0);
        }

        function backToMenu() {
            document.getElementById('main-body').className = 'theme-default';
            document.getElementById('witch-menu').classList.remove('hidden');
            document.getElementById('witch-detail').classList.add('hidden');
        }
    </script>
</body>
</html>
