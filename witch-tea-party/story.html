<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事回憶 - Aelian's Tea Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #37352f;
            font-family: 'Shippori Mincho B1', serif;
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }

        /* 網誌卡片樣式 */
        .story-card {
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            background: white;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .story-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        /* 正方形圖片容器 */
        .image-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f5f5f5;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content-box { padding: 20px; }

        .story-tag {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .story-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: #1a1a1a; }
        .story-excerpt { font-size: 0.9rem; color: #666; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* 排序器樣式 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        select {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Shippori Mincho B1', serif;
            outline: none;
            font-size: 0.9rem;
        }

        .back-home { color: #d4af37; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <a href="index.html" class="back-home">← 返回首頁</a>
            <div>
                <label for="sort" class="text-sm mr-2 text-gray-400">排序依據：</label>
                <select id="sort" onchange="sortStories()">
                    <option value="newest">最新發布</option>
                    <option value="oldest">最舊發布</option>
                    <option value="witch">魔女名字</option>
                </select>
            </div>
        </div>

        <h1 class="text-3xl font-bold mb-10">故事回憶錄</h1>

        <div id="story-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

    <script>
        // 模擬數據（妳可以自行增加或修改）
        const stories = [
            {
                id: 1,
                date: "2026-03-01",
                witch: "深海魔女",
                title: "星空下的海蛞蝓",
                excerpt: "莉妮絲望向海面上的繁星，那裡曾是她的家鄉。今天，她在茶裡加了點特別的東西...",
                image: "witch-tea-party/picture/cb991fda4dd735147fa6854703b0c902.jpg", // 這裡換成妳的圖片連結
                url: "story-detail.html?id=1"
            },
            {
                id: 2,
                date: "2026-03-05",
                witch: "時之魔女",
                title: "停滯的齒輪",
                excerpt: "阿爾特米絲撥動了指針，森林裡的每一片落葉都停在了半空中。時間對她而言，只是玩具。",
                image: "https://via.placeholder.com/400?text=Artemis",
                url: "story-detail.html?id=2"
            },
            {
                id: 3,
                date: "2026-02-20",
                witch: "記憶魔女",
                title: "苦澀的草莓糖",
                excerpt: "這顆糖果記錄了一段被遺忘的童年。露露說，記憶的味道取決於妳如何回味它。",
                image: "https://via.placeholder.com/400?text=Lulu",
                url: "story-detail.html?id=3"
            }
        ];

        function renderStories(data) {
            const list = document.getElementById('story-list');
            list.innerHTML = data.map(story => `
                <div class="story-card" onclick="window.location.href='${story.url}'">
                    <div class="image-box">
                        <img src="${story.image}" alt="${story.title}">
                    </div>
                    <div class="content-box">
                        <span class="story-tag">${story.witch} · ${story.date}</span>
                        <h2 class="story-title">${story.title}</h2>
                        <p class="story-excerpt">${story.excerpt}</p>
                    </div>
                </div>
            `).join('');
        }

        function sortStories() {
            const val = document.getElementById('sort').value;
            let sorted = [...stories];

            if (val === "newest") {
                sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else if (val === "oldest") {
                sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
            } else if (val === "witch") {
                sorted.sort((a, b) => a.witch.localeCompare(b.witch, 'zh-TW'));
            }

            renderStories(sorted);
        }

        // 初始渲染（默認最新）
        sortStories();
    </script>
</body>
</html>
