<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicons -->
  <link href="picture/IMG_1253.png" rel="icon">
  <link href="picture/IMG_1253.png" rel="apple-touch-icon">
    <title>魔女床邊故事</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #37352f;
            font-family: 'Shippori Mincho B1', serif;
            line-height: 1.8;
            /* 讓換頁動畫順一點 */
            scroll-behavior: smooth;
        }

        /* 修正文字內容的間距 */
        .prose p { margin-bottom: 1.8rem; text-align: justify; }
        .prose blockquote { 
            border-left: 3px solid #d4af37; 
            padding-left: 1.5rem; 
            margin: 2rem 0; 
            color: #555;
            background-color: #fdfaf3;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        

        #view-cover {
            width: 100%;
            height: 40vh;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-white">

    <nav class="sticky top-0 bg-white/90 backdrop-blur-sm z-50 border-b border-gray-100">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" id="nav-invite" class="text-[#d4af37] text-sm">← 返回邀請函</a>
        
        <button id="back-btn" class="hidden text-sm text-[#d4af37]" onclick="closeArticle()">← 返回列表</button>
        
        <div id="controls">
            <select id="sort" onchange="applySortAndRender()" 
                    class="text-sm text-gray-500 bg-transparent outline-none cursor-pointer pr-6">
                <option value="newest">最新發布</option>
                <option value="oldest">由舊到新</option>
                <option value="witch">按魔女名</option>
            </select>
        </div>
    </div>
</nav>
    <main class="max-w-4xl mx-auto px-6 py-12">
        <div id="list-view">
            <h1 class="text-3xl font-bold mb-12">故事回憶錄</h1>
            <div id="story-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
                </div>
        </div>

        <div id="article-view" class="hidden">
            <img id="view-cover" src="" alt="Cover">
            <div class="max-w-2xl mx-auto">
                <span id="view-tag" class="text-[#d4af37] text-sm tracking-widest block mb-2"></span>
                <h1 id="view-title" class="text-4xl font-bold mb-4 text-gray-900 leading-tight"></h1>
                <p id="view-date" class="text-sm text-gray-400 mb-10 pb-6 border-b border-gray-100"></p>
                
                <div id="view-body" class="prose">
                    </div>
            </div>
        </div>
    </main>

    <script>
        let allStories = [];

        async function init() {
            try {
                const response = await fetch('stories.json');
                allStories = await response.json();
                applySortAndRender();
            } catch (e) {
                console.error("無法載入故事資料，請檢查 stories.json 是否存在並符合 JSON 格式。");
            }
        }

        function applySortAndRender() {
            const method = document.getElementById('sort').value;
            let sorted = [...allStories];

            if(method === 'newest') sorted.sort((a,b) => new Date(b.date) - new Date(a.date));
            if(method === 'oldest') sorted.sort((a,b) => new Date(a.date) - new Date(b.date));
            if(method === 'witch') sorted.sort((a,b) => a.witch.localeCompare(b.witch, 'zh-TW'));

            const grid = document.getElementById('story-grid');
            grid.innerHTML = sorted.map(s => `
                <div class="group cursor-pointer" onclick="openArticle('${s.id}')">
                    <div class="aspect-square overflow-hidden rounded-lg bg-gray-100 mb-4">
                        <img src="${s.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/400x400?text=No+Image'">
                    </div>
                    <span class="text-xs text-[#d4af37] tracking-widest">${s.witch}</span>
                    <h2 class="text-lg font-bold mt-1 group-hover:text-[#d4af37] transition">${s.title}</h2>
                    <p class="text-sm text-gray-500 mt-2 line-clamp-2">${s.excerpt}</p>
                </div>
            `).join('');
        }

        function openArticle(id) {
    const s = allStories.find(item => item.id === id);
    if(!s) return;

    // 隱藏列表頁面元素
    document.getElementById('list-view').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('nav-invite').classList.add('hidden'); // 隱藏返回邀請函

    // 顯示文章頁面元素
    document.getElementById('article-view').classList.remove('hidden');
    document.getElementById('back-btn').classList.remove('hidden'); // 顯示返回列表

    // 填充文章內容 (這部分維持你原本的代碼)
    const cover = document.getElementById('view-cover');
    if(s.image) {
        cover.src = s.image;
        cover.style.display = 'block';
    } else {
        cover.style.display = 'none';
    }

    document.getElementById('view-tag').innerText = s.witch;
    document.getElementById('view-title').innerText = s.title;
    document.getElementById('view-date').innerText = "發佈日期：" + s.date;
    document.getElementById('view-body').innerHTML = s.content;

    window.scrollTo(0, 0);
}

function closeArticle() {
    // 恢復列表頁面元素
    document.getElementById('list-view').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    document.getElementById('nav-invite').classList.remove('hidden'); // 重新顯示返回邀請函

    // 隱藏文章頁面元素
    document.getElementById('article-view').classList.add('hidden');
    document.getElementById('back-btn').classList.add('hidden'); // 隱藏返回列表
    
    window.scrollTo(0, 0);
}

        init();
    </script>
</body>
</html>
