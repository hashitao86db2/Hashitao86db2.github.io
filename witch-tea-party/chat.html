<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" type="image/png" href="/picture/IMG_2153.png">
    <link rel="apple-touch-icon" href="/picture/IMG_2153.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title># 魔女的祕密茶會 (Logged)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #313338; 
            color: #dbdee1; 
            font-family: 'Shippori Mincho B1', serif; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* 訊息容器 */
        .message-container { 
            position: relative;
            display: flex; 
            flex-direction: column; 
            padding: 8px 16px; /* 手機上稍微增加垂直間距 */
            transition: background 0.1s; 
        }
        .message-container:hover { background-color: #2e3035; }
        
        .main-msg-content { display: flex; align-items: flex-start; }

        /* 頭像放大 */
        .avatar { 
            width: 44px; height: 44px; /* 從 40 放大到 44 */
            border-radius: 50%; 
            background: #4e5058; margin-right: 12px; flex-shrink: 0; 
            border: 1px solid rgba(212, 175, 55, 0.2); 
        }

        /* 文字大小調整 */
        .user-name { font-weight: bold; color: #f2f3f5; margin-right: 8px; font-size: 1rem; }
        .time-stamp { color: #949ba4; font-size: 0.75rem; }
        .text-content { 
            color: #dbdee1; 
            line-height: 1.5; 
            margin-top: 2px; 
            font-size: 1.05rem; /* 內容字體稍微加大 */
        }
        
        /* 引用回覆樣式 (Reply) */
        .reply-wrapper {
            display: flex;
            align-items: center;
            margin-left: 52px; 
            margin-bottom: 4px;
            font-size: 0.9rem; /* 回覆字體也加大 */
            color: #b5bac1;
            position: relative;
        }
        
        /* 回覆的那條小勾線 */
        .reply-line {
            position: absolute;
            left: -30px;
            top: 50%;
            width: 22px;
            height: 10px;
            border-left: 2px solid #4e5058;
            border-top: 2px solid #4e5058;
            border-top-left-radius: 6px;
        }

        .reply-avatar { width: 18px; height: 18px; border-radius: 50%; margin-right: 5px; }
        .reply-user { font-weight: bold; color: #b5bac1; margin-right: 5px; opacity: 0.8; }
        .reply-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }

        .role-tag { 
            font-size: 0.7rem; 
            background: #d4af37; 
            color: #1a1a1a; 
            padding: 1px 6px; 
            border-radius: 3px; 
            margin-left: 5px; 
            vertical-align: middle; 
            font-weight: bold;
        }

        /* 針對手機的小螢幕優化 */
        @media (max-width: 640px) {
            .text-content { font-size: 1.1rem; } /* 手機字體再大一點點 */
            .reply-text { max-width: 180px; } /* 手機回覆內容縮短避免破版 */
            .avatar { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <div class="sticky top-0 bg-[#313338] border-b border-[#26272d] p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center">
            <span class="text-[#80848e] text-2xl mr-2">#</span>
            <span class="font-bold text-lg">魔女們的茶會紀錄</span>
        </div>
        <a href="witches.html" class="text-sm text-[#949ba4] hover:underline bg-[#1e1f22] px-3 py-1 rounded">退出</a>
    </div>

    <div class="py-4 space-y-2">

        <div class="message-container">
            <div class="reply-wrapper">
                <div class="reply-line"></div>
                <img src="picture/IMG_2150.jpg" class="reply-avatar">
                <span class="reply-user">艾利安 • 桑坦</span>
                <span class="reply-text">大家要不要來我的植物園喝茶？</span>
            </div>
            <div class="main-msg-content">
                <div class="avatar"><img src="picture/IMG_2147.jpg" class="rounded-full h-full w-full object-cover"></div>
                <div>
                    <div><span class="user-name">夏伊爾</span><span class="role-tag">草藥魔法師</span><span class="time-stamp">今天 15:05</span></div>
                    <div class="text-content">我才不要，希洛差點被食人花吃了！</div>
                </div>
            </div>
        </div>

        <div class="message-container">
            <div class="main-msg-content">
                <div class="avatar"><img src="picture/IMG_2149.jpg" class="rounded-full h-full w-full object-cover"></div>
                <div>
                    <div><span class="user-name">莉妮絲 • 莫諾托</span><span class="role-tag">深海魔女</span><span class="time-stamp">今天 15:10</span></div>
                    <div class="text-content">呵呵，需要幫大家都加點「特製配方」嗎？</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
