<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title># 魔女的祕密茶會 (Logged)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&display=swap" rel="stylesheet">
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: 'Shippori Mincho B1', serif; }
        
        /* 訊息容器 */
        .message-container { 
            position: relative;
            display: flex; 
            flex-direction: column; /* 讓回覆顯示在頭像上方 */
            padding: 2px 20px; 
            transition: background 0.1s; 
            margin-top: 10px;
        }
        .message-container:hover { background-color: #2e3035; }
        
        .main-msg-content { display: flex; align-items: flex-start; }

        .avatar { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: #4e5058; margin-right: 15px; flex-shrink: 0; 
            border: 1px solid rgba(212, 175, 55, 0.2); 
        }

        .user-name { font-weight: bold; color: #f2f3f5; margin-right: 8px; font-size: 0.95rem; }
        .time-stamp { color: #949ba4; font-size: 0.75rem; }
        .text-content { color: #dbdee1; line-height: 1.4; margin-top: 2px; }
        
        /* 引用回覆樣式 (Reply) */
        .reply-wrapper {
            display: flex;
            align-items: center;
            margin-left: 56px; /* 頭像寬度 + 間距 */
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: #b5bac1;
            position: relative;
        }
        
        /* 回覆的那條小勾線 */
        .reply-line {
            position: absolute;
            left: -33px;
            top: 50%;
            width: 25px;
            height: 10px;
            border-left: 2px solid #4e5058;
            border-top: 2px solid #4e5058;
            border-top-left-radius: 6px;
        }

        .reply-avatar { width: 16px; height: 16px; border-radius: 50%; margin-right: 5px; }
        .reply-user { font-weight: bold; color: #b5bac1; margin-right: 5px; opacity: 0.8; }
        .reply-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }
        .reply-text:hover { color: #ffffff; cursor: pointer; }

        .role-tag { font-size: 0.65rem; background: #d4af37; color: #1a1a1a; padding: 1px 4px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="sticky top-0 bg-[#313338] border-b border-[#26272d] p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center">
            <span class="text-[#80848e] text-2xl mr-2">#</span>
            <span class="font-bold">魔女們的茶會紀錄</span>
        </div>
        <a href="witches.html" class="text-xs text-[#949ba4] hover:underline">退出頻道</a>
    </div>

    <div class="py-6 space-y-1">

        <div class="message-container">
            <div class="main-msg-content">
                <div class="avatar"><img src="picture/IMG_2150.jpg" class="rounded-full h-full w-full object-cover"></div>
                <div>
                    <div><span class="user-name">艾利安 • 桑坦</span><span class="role-tag">時之魔女</span><span class="time-stamp">今天 15:00</span></div>
                    <div class="text-content">今天天氣真好，大家要不要來我的植物園喝茶？</div>
                </div>
            </div>
        </div>

        <div class="message-container">
            <div class="reply-wrapper">
                <div class="reply-line"></div>
                <img src="picture/IMG_2147.jpg" class="reply-avatar">
                <span class="reply-user">夏伊爾</span>
                <span class="reply-text">今天天氣真好，大家要不要來我的植物園喝茶？</span>
            </div>
            <div class="main-msg-content">
                <div class="avatar"><img src="picture/IMG_2147.jpg" class="rounded-full h-full w-full object-cover"></div>
                <div>
                    <div><span class="user-name">夏伊爾</span><span class="role-tag">草藥魔法師</span><span class="time-stamp">今天 15:05</span></div>
                    <div class="text-content">我才不要，上次去你的植物園，希洛差點被你的食人花當點心吃了。</div>
                </div>
            </div>
        </div>

        <div class="message-container">
            <div class="reply-wrapper">
                <div class="reply-line"></div>
                <img src="picture/IMG_2150.jpg" class="reply-avatar">
                <span class="reply-user">艾利安 • 桑坦</span>
                <span class="reply-text">希洛差點被你的食人花當點心吃了。</span>
            </div>
            <div class="main-msg-content">
                <div class="avatar"><img src="picture/IMG_2150.jpg" class="rounded-full h-full w-full object-cover"></div>
                <div>
                    <div><span class="user-name">艾利安 • 桑坦</span><span class="role-tag">時之魔女</span><span class="time-stamp">今天 15:06</span></div>
                    <div class="text-content">哎呀親愛的，那是「熱情的招呼」好嗎？世界第一漂亮的魔女是不會養兇殘生物的。</div>
                </div>
            </div>
        </div>

        <div class="message-container">
            <div class="main-msg-content">
                <div class="avatar"><img src="picture/IMG_2149.jpg" class="rounded-full h-full w-full object-cover"></div>
                <div>
                    <div><span class="user-name">莉妮絲 • 莫諾托</span><span class="role-tag">深海魔女</span><span class="time-stamp">今天 15:10</span></div>
                    <div class="text-content">如果你們要吵架的話，我可以提供一點「加料」的茶水讓大家冷靜一下。呵呵。</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
